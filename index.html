function scrambleTitle(el) {
  const glyphs = "abcdefghijklmnopqrstuvwxyz!<>-_\\/[]{}=+*^?#@01";
  const orig = el.textContent;
  let frame = 0;
  (function step() {
    frame++;
    const solved = Math.floor(frame / 2);
    let out = "";
    for (let i = 0; i < orig.length; i++) {
      out += i < solved ? orig[i] : (orig[i] === " " ? " " : glyphs[Math.floor(Math.random() * glyphs.length)]);
    }
    el.textContent = out;
    if (solved < orig.length) requestAnimationFrame(step);
    else el.textContent = orig;
  })();
}

const canvas = $("net"), ctx = canvas.getContext("2d");
const mPos = { x: -9e3, y: -9e3 };
let W, H;
function sizeNet() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
sizeNet();
addEventListener("resize", sizeNet);
const parts = Array.from({ length: Math.min(90, Math.floor(innerWidth * innerHeight / 18000)) }, () => ({
  x: Math.random() * innerWidth, y: Math.random() * innerHeight,
  vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
  r: Math.random() * 1.6 + 0.6
}));
(function drawNet() {
  ctx.clearRect(0, 0, W, H);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
  }
  for (let i = 0; i < parts.length; i++) {
    const a = parts[i];
    for (let j = i + 1; j < parts.length; j++) {
      const b = parts[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 < 16900) {
        ctx.strokeStyle = `rgba(108,140,255,${(1 - Math.sqrt(d2) / 130) * 0.15})`;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  for (const p of parts) {
    const dxm = p.x - mPos.x, dym = p.y - mPos.y, dm2 = dxm * dxm + dym * dym;
    if (dm2 < 19600) {
      ctx.strokeStyle = `rgba(45,212,191,${(1 - Math.sqrt(dm2) / 140) * 0.35})`;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mPos.x, mPos.y); ctx.stroke();
    }
  }
  ctx.fillStyle = "rgba(157,108,255,0.45)";
  for (const p of parts) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  requestAnimationFrame(drawNet);
})();
